name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      - run: npm test --if-present
        continue-on-error: true
      # Pages projeyi alt yolda sunar; base CLI'dan veriliyor ki depo kaynagi degismesin.
      - run: npx vite build --base=/chunked-heightmap-terrain-threejs/
      # Koke mutlak sayfa linkleri alt yolda kirilir; build ciktisinda goreliye cevir.
      - name: Sayfa arasi linkleri goreli yap
        run: |
          find dist -name '*.html' -print0 | xargs -0 -r sed -i             -e 's|href="/\([A-Za-z0-9._-]*\.html\)"|href="./\1"|g'             -e 's|href="/"|href="./index.html"|g'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
